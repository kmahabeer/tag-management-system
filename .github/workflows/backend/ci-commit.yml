name: Backend CI - Commit

on:
  push:
    branches-ignore: [main]
    paths: ["backend/**", "openapi.yaml"]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run fast tests
        working-directory: backend
        run: go test -v -short ./...

      - name: Run go vet
        working-directory: backend
        run: go vet ./...
