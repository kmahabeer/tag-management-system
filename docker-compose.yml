services:

  dev:
    container_name: tag-management-system_dev
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspaces/tag-management-system:cached
    entrypoint: []
    command: sleep infinity
    networks:
      - devnet
    depends_on:
      - postgres_db
      - backend
      - frontend

  backend:
    container_name: tag-management-system_backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://app:app@postgres_db:5432/app
    networks:
      - devnet
    depends_on:
      - postgres_db
    volumes:
      - ./backend:/app
    command: go run ./cmd/server

  frontend:
    container_name: tag-management-system_frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5175:5175"
    networks:
      - devnet
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  postgres_db:
    container_name: tag-management-system_db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optionally replace the above with a host bind mount if you want to browse data locally:
      # - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - devnet
    ports:
      - "5432:5432"

  pgadmin:
    container_name: tag-management-system_pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db
    networks:
      - devnet

networks:
  devnet:


volumes:
  postgres-data:
    name: tag-management-system_postgres_data
    external: true
